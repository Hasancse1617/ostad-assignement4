server {
    listen 80;
    server_name _;

    # Serve the React application from the Nginx root directory
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # This allows React Router to handle the routing
        try_files $uri $uri/ /index.html;
    }

    # Optional: Reverse Proxy for Backend API
    # If you want to route all /api requests from the frontend to your private backend EC2
    # location /api/ {
    #     proxy_pass http://<BACKEND_PRIVATE_IP>:5050/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection 'upgrade';
    #     proxy_set_header Host $host;
    #     proxy_cache_bypass $http_upgrade;
    # }
}
